<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" type="image/png" href="/favicon.png"><meta name="apple-mobile-web-app-title" content="EA">
<meta name="theme-color" content="#0b0a1a">
<title>{% block title %}Giriş · Emre'nin Asistanı{% endblock %}</title>
<style>
  :root {
    --bg: #0b0a1a; --ink: #f4f2ff; --muted: #a8a3c7; --line: rgba(255,255,255,.12);
    --glass: rgba(22, 20, 44, .62); --field: rgba(255,255,255,.06); --field-focus: rgba(255,255,255,.1);
    --a1: #7c6cff; --a2: #c06cff; --a3: #ff8f6c; --ok: #6ee7b7; --err: #ff8a8a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); overflow-x: hidden;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Arka plan: yavaş akan ışık bulutları ve ince ızgara */
  .sahne { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .bulut { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; will-change: transform; }
  .b1 { width: 520px; height: 520px; left: -140px; top: -120px; background: radial-gradient(circle, var(--a1), transparent 65%); animation: suz1 22s ease-in-out infinite alternate; }
  .b2 { width: 460px; height: 460px; right: -160px; top: 18%; background: radial-gradient(circle, var(--a2), transparent 65%); animation: suz2 26s ease-in-out infinite alternate; }
  .b3 { width: 420px; height: 420px; left: 22%; bottom: -200px; background: radial-gradient(circle, var(--a3), transparent 65%); opacity: .38; animation: suz3 30s ease-in-out infinite alternate; }
  .izgara { position: absolute; inset: 0; opacity: .5;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px; -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); }
  @keyframes suz1 { to { transform: translate(120px, 90px) scale(1.1); } }
  @keyframes suz2 { to { transform: translate(-110px, 70px) scale(.92); } }
  @keyframes suz3 { to { transform: translate(90px, -80px) scale(1.12); } }
  @media (prefers-reduced-motion: reduce) { .bulut { animation: none; } }

  .ortala { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: max(28px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom)); }
  .kart { width: min(420px, 100%); padding: 34px 28px 26px; border-radius: 26px; background: var(--glass); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.08); animation: gir .7s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes gir { from { opacity: 0; transform: translateY(14px) scale(.98); } }

  .marka { display: grid; justify-items: center; text-align: center; gap: 14px; margin-bottom: 26px; }
  .logo { position: relative; width: 74px; height: 74px; border-radius: 22px; display: grid; place-items: center;
    background: conic-gradient(from 210deg, var(--a1), var(--a2), var(--a3), var(--a1)); box-shadow: 0 12px 40px rgba(124,108,255,.45); }
  .logo::after { content: ""; position: absolute; inset: 2px; border-radius: 20px; background: linear-gradient(160deg, #1b1838, #0f0d22); }
  .logo span { position: relative; z-index: 1; font-weight: 800; font-size: 24px; letter-spacing: .02em;
    background: linear-gradient(135deg, #fff, #d9d2ff 60%, #ffc9b8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo i { position: absolute; z-index: 1; right: -6px; top: -6px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font-style: normal; font-size: 12px; background: #fff; color: #5b4fe9; box-shadow: 0 4px 14px rgba(0,0,0,.3); animation: parla 3.2s ease-in-out infinite; }
  @keyframes parla { 50% { transform: scale(1.12) rotate(18deg); } }
  h1 { margin: 0; font-size: 28px; line-height: 1.15; letter-spacing: -.02em; font-weight: 750;
    background: linear-gradient(120deg, #ffffff 10%, #cfc7ff 55%, #ffb9a3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .alt { margin: -4px 0 0; color: var(--muted); font-size: 14px; }
  .yetenek { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  .yetenek span { font-size: 12px; color: #d8d3ff; padding: 4px 10px; border-radius: 999px; background: rgba(124,108,255,.14); border: 1px solid rgba(124,108,255,.28); }

  form { display: grid; gap: 14px; }
  .alan { display: grid; gap: 6px; }
  .alan label { font-size: 13px; font-weight: 600; color: #d6d2ee; }
  .kutu { position: relative; }
  .kutu input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); padding: 13px 14px 13px 44px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--field); outline: none; transition: border-color .2s, background .2s, box-shadow .2s; }
  .kutu input::placeholder { color: #7f7aa3; }
  .kutu input:focus { border-color: rgba(160,148,255,.8); background: var(--field-focus); box-shadow: 0 0 0 4px rgba(124,108,255,.18); }
  .kutu svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #8e88b8; pointer-events: none; }
  .goster { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: #a9a3d6; font: inherit; font-size: 12px; font-weight: 600; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .goster:hover { background: rgba(255,255,255,.08); color: #fff; }
  .kutu input.sifreli { padding-right: 70px; }

  .satir { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; }
  .hatirla { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; color: #d6d2ee; user-select: none; }
  .hatirla input { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; border-radius: 6px; border: 1px solid rgba(255,255,255,.28); background: var(--field); display: grid; place-items: center; cursor: pointer; transition: .15s; }
  .hatirla input:checked { background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }
  .hatirla input:checked::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px, -1px); }
  a { color: #c9c1ff; text-decoration: none; font-weight: 600; }
  a:hover { color: #fff; text-decoration: underline; }

  .dugme { position: relative; overflow: hidden; margin-top: 4px; border: 0; border-radius: 14px; padding: 14px 18px; cursor: pointer; font: inherit; font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(120deg, var(--a1), var(--a2) 55%, var(--a3)); background-size: 160% 100%; box-shadow: 0 12px 30px rgba(124,108,255,.38); transition: background-position .5s, transform .15s, box-shadow .2s; }
  .dugme:hover { background-position: 100% 0; box-shadow: 0 16px 38px rgba(192,108,255,.45); }
  .dugme:active { transform: scale(.985); }
  .dugme::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-120%); animation: isilti 4s ease-in-out 1.2s infinite; }
  @keyframes isilti { 30%, 100% { transform: translateX(120%); } }

  .not { padding: 11px 14px; border-radius: 12px; font-size: 14px; line-height: 1.45; }
  .not.hata { background: rgba(255,90,90,.12); border: 1px solid rgba(255,120,120,.3); color: #ffd1d1; }
  .not.ok { background: rgba(110,231,183,.1); border: 1px solid rgba(110,231,183,.3); color: #c9f7e4; }
  .dugme.ikincil { background: rgba(255,255,255,.07); border: 1px solid rgba(160,148,255,.45); box-shadow: none; text-align: center; text-decoration: none; display: block; }
  .dugme.ikincil::after { display: none; }
  .dugme.ikincil:hover { background: rgba(124,108,255,.18); text-decoration: none; }
  .ayrac { display: flex; align-items: center; gap: 10px; color: #8f8ab3; font-size: 12px; }
  .ayrac::before, .ayrac::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .dogru { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; font-weight: 700; color: var(--ok); }
  .kutu input[readonly] { color: #e9e6ff; background: rgba(110,231,183,.06); border-color: rgba(110,231,183,.35); }
  .ipucu { margin: 0; font-size: 12.5px; color: var(--muted); }
  .alt-bilgi { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: center; align-items: center; gap: 8px; color: #8f8ab3; font-size: 12px; }
  .alt-bilgi b { color: #d7d1ff; font-weight: 600; }
  .nokta { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  :focus-visible { outline: 2px solid #b8adff; outline-offset: 2px; }
  @media (max-width: 420px) { .kart { padding: 28px 20px 22px; border-radius: 22px; } h1 { font-size: 25px; } }
</style>
</head>
<body>
<div class="sahne" aria-hidden="true"><div class="bulut b1"></div><div class="bulut b2"></div><div class="bulut b3"></div><div class="izgara"></div></div>
<main class="ortala">
  <section class="kart">
    <div class="marka">
      <div class="logo"><span>EA</span><i>✦</i></div>
      <h1>Emre'nin Asistanı</h1>
      <p class="alt">{% block alt %}Claude ile çalışan kişisel iş asistanınız{% endblock %}</p>
      {% block yetenek %}<div class="yetenek"><span>Ajanda</span><span>Mail Takibi</span><span>İş Planlama</span><span>Hatırlatmalar</span></div>{% endblock %}
    </div>
    {% block icerik %}{% endblock %}
    <div class="alt-bilgi"><span class="nokta"></span><span>Güvenli bağlantı · <b>Claude</b> ile çalışır</span></div>
  </section>
</main>
<script>
  document.querySelectorAll('.goster').forEach(function (b) {
    b.addEventListener('click', function () {
      var i = document.getElementById(b.dataset.icin); var acik = i.type === 'text';
      i.type = acik ? 'password' : 'text'; b.textContent = acik ? 'Göster' : 'Gizle'; i.focus();
    });
  });
</script>
</body>
</html>
