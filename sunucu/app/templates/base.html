<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>{% block title %}Emre'nin Asistanı{% endblock %}</title>
<style>
  /* EA teması: ana ekranla aynı koyu, ışıklı görünüm */
  :root {
    --bg: #0b0a1a; --card: rgba(26, 23, 52, .66); --text: #f1efff; --muted: #a8a3c7; --line: rgba(255,255,255,.12);
    --red: #ff8a80; --red-bg: rgba(255,90,90,.14); --amber: #f7c26b; --amber-bg: rgba(247,194,107,.13);
    --blue: #b3a8ff; --blue-bg: rgba(124,108,255,.18); --gray-bg: rgba(255,255,255,.07);
    --violet: #cdb0ff; --violet-bg: rgba(192,108,255,.17);
    --orange: #ffa477; --orange-bg: rgba(255,143,108,.15); --teal: #6fe3f2; --teal-bg: rgba(56,225,255,.12);
    --a1: #7c6cff; --a2: #c06cff; --a3: #ff8f6c; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; -webkit-font-smoothing: antialiased;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 64px; }
  a { color: var(--blue); }
  .sahne { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
  .bulut { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .45; }
  .b1 { width: 560px; height: 560px; left: -180px; top: -180px; background: radial-gradient(circle, var(--a1), transparent 65%); animation: suz1 24s ease-in-out infinite alternate; }
  .b2 { width: 480px; height: 480px; right: -180px; top: 30%; background: radial-gradient(circle, var(--a2), transparent 65%); animation: suz2 28s ease-in-out infinite alternate; }
  .b3 { width: 440px; height: 440px; left: 25%; bottom: -240px; background: radial-gradient(circle, var(--a3), transparent 65%); opacity: .3; animation: suz3 32s ease-in-out infinite alternate; }
  @keyframes suz1 { to { transform: translate(110px, 80px) scale(1.08); } }
  @keyframes suz2 { to { transform: translate(-100px, 60px) scale(.92); } }
  @keyframes suz3 { to { transform: translate(80px, -70px) scale(1.1); } }
  @media (prefers-reduced-motion: reduce) { .bulut { animation: none; } }
  .card, .p-card, details, ul.compact, .stat, .hub-card, .login form { -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
  header h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 24px 0 32px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--muted); font-size: 13px; }
  .stat.alert b { color: var(--red); }
  h2 { font-size: 17px; margin: 36px 0 12px; display: flex; align-items: center; gap: 8px; }
  h2 .dot { width: 10px; height: 10px; border-radius: 50%; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .card.complaint { border-left-color: var(--red); background: linear-gradient(90deg, var(--red-bg), var(--card) 40%); }
  .card.high { border-left-color: var(--red); }
  .card.vip { border-left-color: var(--violet); }
  .card.mid { border-left-color: var(--amber); }
  .card.pay { border-left-color: var(--orange); background: linear-gradient(90deg, var(--orange-bg), var(--card) 40%); }
  .card.shared { border-left-color: var(--teal); }
  .card .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .card h3 { font-size: 15px; margin: 0; }
  .meta { color: var(--muted); font-size: 13px; }
  .card p { margin: 6px 0 0; }
  .action { margin-top: 8px; font-size: 14px; }
  .action b { color: var(--red); }
  .card.vip .action b { color: var(--violet); }
  .card.mid .action b { color: var(--amber); }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--gray-bg); color: var(--muted); }
  .tag.to { background: var(--blue-bg); color: var(--blue); }
  .tag.unread { background: var(--red-bg); color: var(--red); }
  .tag.person { background: var(--violet-bg); color: var(--violet); font-weight: 600; }
  .tag.comp { background: var(--red-bg); color: var(--red); font-weight: 600; }
  .open { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; text-decoration: none;
    color: var(--blue); background: var(--blue-bg); padding: 4px 12px; border-radius: 999px; }
  .open:hover { text-decoration: underline; }
  .quote { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--line); color: var(--muted); font-size: 14px; }
  .tag.pay { background: var(--orange-bg); color: var(--orange); font-weight: 600; }
  .tag.shared { background: var(--teal-bg); color: var(--teal); font-weight: 600; }
  .quiet { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
  ul.compact { list-style: none; padding: 0; margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  ul.compact li { padding: 10px 16px; border-top: 1px solid var(--line); }
  ul.compact li:first-child { border-top: 0; }
  ul.compact .meta { display: block; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; margin-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); width: 60px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .nav .brand { font-weight: 700; font-size: 15px; display: flex; gap: 10px; align-items: center; color: var(--text); text-decoration: none; }
  .nav .brand { color: #e8e5ff; }
  .nav .brand i { position: relative; font-style: normal; width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #fff;
    background: conic-gradient(from 210deg, var(--a1), var(--a2), var(--a3), var(--a1)); box-shadow: 0 6px 20px rgba(124,108,255,.4); }
  .nav .links { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .nav .links a, .nav .links button { color: var(--muted); text-decoration: none; font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; }
  .nav .links a:hover, .nav .links button:hover, .nav .links a.on { background: var(--gray-bg); color: var(--text); }
  .note { padding: 10px 14px; border-radius: 10px; background: var(--gray-bg); font-size: 14px; margin: 12px 0; }
  .note.err { background: var(--red-bg); color: var(--red); }
  .note.ok { background: var(--blue-bg); color: var(--blue); }
  .btn { font: inherit; font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .btn.primary { background: linear-gradient(120deg, var(--a1), var(--a2)); color: #fff; border-color: transparent; box-shadow: 0 8px 22px rgba(124,108,255,.35); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  form.inline { display: inline; margin: 0; }
  .field { display: grid; gap: 6px; margin-bottom: 14px; }
  .field label { font-weight: 600; font-size: 14px; }
  .field small { color: var(--muted); font-size: 12px; }
  input[type=text], input[type=password], input[type=number], textarea { font: inherit; font-size: 15px; width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  textarea { min-height: 90px; resize: vertical; }
  .login { min-height: 80vh; display: grid; place-items: center; }
  .login form { width: min(360px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; display: grid; gap: 12px; }
  .login h1 { font-size: 20px; margin: 0; }
  .muted { color: var(--muted); }
  .open + .open { margin-left: 6px; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .hub { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 20px; }
  .hub-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
  .hub-head { display: flex; align-items: center; gap: 8px; }
  .hub-head h2 { margin: 0; font-size: 19px; }
  .hub-head .dot { width: 10px; height: 10px; border-radius: 50%; }
  .hub-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  .hub-stats div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
  .hub-stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .hub-stats span { font-size: 12px; color: var(--muted); }
  .hub-stats .warn b { color: var(--red); }
  .hub-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .hub-list li { display: flex; gap: 10px; overflow-wrap: anywhere; }
  .hub-list .t { flex: 0 0 52px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hub-note { margin: 0; font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--gray-bg); }
  .hub-sub { margin: 4px 0 0; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .hub-actions { margin-top: 4px; }
  a.btn { text-decoration: none; display: inline-block; }
  .mailhead { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 14px; }
  .mailhead td { padding: 4px 0; vertical-align: top; border-top: 0; overflow-wrap: anywhere; }
  .mailhead td:first-child { width: 70px; color: var(--muted); }
  .mailbody { white-space: pre-wrap; overflow-wrap: anywhere; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); border-radius: 10px; padding: 14px; margin: 0 0 12px; max-height: none; }
  .open.read { background: linear-gradient(120deg, var(--a1), var(--a2)); color: #fff; }
  /* Rapor: ana başlıklar (açılır) */
  .pano { display: grid; gap: 10px; margin: 24px 0 8px; }
  .p-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; scroll-margin-top: 16px; min-width: 0;
    padding: 0; margin: 0; transition: border-color .15s, box-shadow .15s; }
  .p-card:hover { border-color: var(--c); }
  .p-card[open] { border-color: var(--c); box-shadow: 0 6px 20px rgba(0,0,0,.05); }
  .p-head { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 14px; align-items: center;
    padding: 16px 18px; cursor: pointer; font-weight: 400; }
  .p-head::-webkit-details-marker { display: none; }
  .p-card[open] .p-head { background: linear-gradient(180deg, var(--cbg), var(--card)); border-bottom: 1px solid var(--line); }
  .p-ikon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-weight: 700; font-size: 17px; color: var(--c); background: var(--cbg); }
  .p-card[open] .p-ikon { color: #fff; background: var(--c); }
  .p-baslik { display: grid; gap: 1px; min-width: 0; }
  .p-baslik b { font-size: 16px; }
  .p-baslik small { font-size: 12.5px; color: var(--muted); }
  .p-say { min-width: 36px; padding: 3px 11px; border-radius: 999px; text-align: center; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--c); background: var(--cbg); }
  .p-card.bos .p-say { color: var(--muted); background: var(--gray-bg); }
  .p-ok { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; transition: transform .2s; }
  .p-card[open] .p-ok { transform: rotate(225deg); margin: 4px 4px 0 0; }
  .p-list { list-style: none; margin: 0; padding: 0; }
  .p-list li + li { border-top: 1px solid var(--line); }
  .p-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 18px; color: inherit; text-decoration: none; }
  a.p-row:hover { background: var(--bg); }
  a.p-row:hover .p-go { color: var(--c); }
  .p-main { display: grid; gap: 3px; min-width: 0; }
  .p-main b { font-size: 14px; overflow-wrap: anywhere; }
  .p-meta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .p-badge { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--red); background: var(--red-bg); }
  .p-ozet, .p-adim { font-size: 13px; }
  .p-adim b { color: var(--c); }
  .p-alinti { font-size: 13px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 8px; font-style: italic; }
  .p-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .p-tags:empty { display: none; }
  .p-tags span { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--gray-bg); color: var(--muted); }
  .p-tags span.son { background: var(--orange-bg); color: var(--orange); font-weight: 600; }
  .p-tags span.kisi { background: var(--violet-bg); color: var(--violet); font-weight: 600; }
  .p-go { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .p-ek { display: flex; gap: 10px; padding: 0 18px 10px; font-size: 12px; }
  .p-ek a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .p-bos, .p-alt { margin: 0; padding: 12px 18px; font-size: 13px; color: var(--muted); }
  .p-alt { border-top: 1px solid var(--line); font-size: 12px; }
  .diger { margin-top: 28px; display: grid; gap: 8px; }
  .diger details { margin: 0; }
  .diger summary { font-weight: 500; color: var(--muted); font-size: 14px; }
  .diger ul.compact { border: 0; margin-top: 6px; }
  details[id] { scroll-margin-top: 16px; }
  .guncel { display: none; }
  .guncel.on { display: flex; gap: 10px; align-items: center; margin: 16px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 14px; background: var(--blue-bg); color: var(--blue); }
  .guncel.hata { background: var(--red-bg); color: var(--red); }
  .spin { width: 14px; height: 14px; flex: 0 0 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: don 0.8s linear infinite; }
  @keyframes don { to { transform: rotate(360deg); } }
  @media (max-width: 520px) { .p-head { padding: 14px; gap: 10px; } .p-baslik small { display: none; } .p-row { padding: 12px 14px; } }
  .nav { flex-wrap: nowrap; }
  .nav .brand { white-space: nowrap; }
  .nav .links { flex-wrap: nowrap; gap: 6px; }
  .nav .links a.yuvarlak, .nav .links button.yuvarlak { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: grid; place-items: center; color: #cfcaf0;
    background: rgba(255,255,255,.06); border: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .nav .links a.yuvarlak:hover, .nav .links button.yuvarlak:hover { background: rgba(255,255,255,.12); color: #fff; }
  .nav .links a.yuvarlak.on { color: #fff; background: linear-gradient(135deg, var(--a1), var(--a2)); border-color: transparent; }
  .yuvarlak svg { width: 18px; height: 18px; }
  @media (max-width: 420px) { .nav .brand { font-size: 0; gap: 0; } .nav .links a.yuvarlak, .nav .links button.yuvarlak { width: 36px; height: 36px; } }
  /* Uygulama ikonları (ana ekranla aynı) */
  .m-ikonlar { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 26px 0 14px; padding: 16px 10px 10px; border-radius: 26px;
    background: rgba(22, 20, 44, .42); border: 1px solid var(--line); -webkit-backdrop-filter: blur(20px) saturate(140%); backdrop-filter: blur(20px) saturate(140%); }
  .uygulama { position: relative; display: grid; justify-items: center; align-content: start; gap: 8px; padding: 10px 2px 12px; border-radius: 18px; text-align: center;
    background: transparent; border: 0; color: inherit; font: inherit; cursor: pointer; text-decoration: none;
    animation: cik .5s cubic-bezier(.2,.9,.3,1.2) both; animation-delay: calc(var(--sira, 0) * 60ms + 120ms); transition: background .2s; }
  .uygulama:hover { background: rgba(255,255,255,.05); }
  .uygulama[aria-expanded="true"] { background: rgba(255,255,255,.08); }
  .uygulama[aria-expanded="true"] .ikon { box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 14px 30px -6px var(--g1); }
  @keyframes cik { from { opacity: 0; transform: translateY(10px) scale(.85); } }
  .kap { position: relative; }
  .ikon { position: relative; width: 66px; height: 66px; border-radius: 20px; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(145deg, var(--g1), var(--g2)); box-shadow: 0 10px 24px -6px var(--g1), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s; }
  .ikon svg { width: 50px; height: 50px; position: relative; z-index: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,.18)); }
  .parlak { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(255,255,255,.38), transparent 45%); z-index: 2; pointer-events: none; }
  .uygulama:hover .ikon { transform: translateY(-4px) scale(1.06); }
  .uygulama:active .ikon { transform: scale(.94); }
  .uygulama.bos .ikon { filter: saturate(.55) brightness(.85); }
  .etiket { display: grid; font-size: 13px; font-weight: 650; line-height: 1.2; color: #f1efff; }
  .etiket small { font-size: 11px; font-weight: 500; color: var(--muted); }
  .rozet { position: absolute; top: -6px; right: -6px; z-index: 3; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: grid; place-items: center;
    font-size: 12px; font-weight: 700; color: #fff; background: #ff3b30; border: 2px solid #15132c; box-shadow: 0 4px 10px rgba(255,59,48,.45); }
  .nabiz { transform-origin: center; transform-box: fill-box; animation: nabiz 2.4s ease-in-out infinite; }
  @keyframes nabiz { 50% { transform: scale(1.25); } }
  .m-panel { margin-bottom: 12px; border-color: var(--c); box-shadow: 0 0 0 3px var(--cbg); animation: panel .35s cubic-bezier(.2,.8,.2,1) both; scroll-margin-top: 12px; }
  @keyframes panel { from { opacity: 0; transform: translateY(-8px); } }
  .m-panel .p-head { grid-template-columns: minmax(0, 1fr) auto auto; cursor: default; background: linear-gradient(180deg, var(--cbg), transparent); border-bottom: 1px solid var(--line); }
  .p-kapat { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--muted); cursor: pointer; font-size: 13px; }
  .p-kapat:hover { color: #fff; background: rgba(255,255,255,.12); }
  @media (max-width: 520px) {
    .m-ikonlar { gap: 2px; padding: 14px 4px 8px; border-radius: 22px; }
    .ikon { width: 56px; height: 56px; border-radius: 17px; } .ikon svg { width: 42px; height: 42px; }
    .etiket { font-size: 11px; } .etiket small { font-size: 9.5px; }
  }
  @media (prefers-reduced-motion: reduce) { .uygulama, .nabiz, .m-panel { animation: none; } }
  @media (max-width: 420px) { .hub-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="sahne" aria-hidden="true"><div class="bulut b1"></div><div class="bulut b2"></div><div class="bulut b3"></div></div>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
